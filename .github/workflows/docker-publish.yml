name: Publish Docker image

# Pushes docker.io/stefanoamorelli/nasdaq-data-link-mcp for linux/amd64 and
# linux/arm64 with SBOM and provenance attestations. Tags for release v2.1.3:
# 2.1.3, 2.1, 2 and latest (pre-releases only get their full version).
# Needs a "dockerhub" environment (add a required reviewer and limit it to v*
# tags) holding the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with read/write scope on this repository).

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/stefanoamorelli/nasdaq-data-link-mcp

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/stefanoamorelli/nasdaq-data-link-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches pyproject.toml and server.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/check_release_version.py "$TAG"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the smoke test (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: nasdaq-data-link-mcp:smoke
          no-cache: true
      - name: Smoke test over stdio
        run: >-
          python3 .github/scripts/mcp_stdio_smoke.py
          --expect-tool ndl_search_tables --expect-tool ndl_query_table
          --call ndl_search_tables --arguments '{"query": "WB/DATA", "limit": 1}'
          -- docker run --rm -i nasdaq-data-link-mcp:smoke

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ !github.event.release.prerelease }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          no-cache: true
