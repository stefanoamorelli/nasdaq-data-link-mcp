name: Publish to PyPI and the MCP Registry

# One-time setup:
# - PyPI: add a Trusted Publisher to the nasdaq-data-link-mcp-os project
#   (owner stefanoamorelli, repository nasdaq-data-link-mcp, workflow
#   publish_pypi.yml, environment pypi). No API token is stored in GitHub.
# - GitHub: create the "pypi" environment; adding a required reviewer makes
#   every upload wait for an explicit approval.
# - MCP Registry: nothing to configure. The job logs in with GitHub OIDC, which
#   grants the io.github.stefanoamorelli/* namespace. The registry checks that
#   the PyPI README contains "mcp-name: io.github.stefanoamorelli/nasdaq-data-link-mcp"
#   and that the Docker image (pushed by docker-publish.yml) carries the
#   io.modelcontextprotocol.server.name label.
#
# Manual fallback for the registry step (from a checkout of the release tag):
#   mcp-publisher login github && mcp-publisher publish server.json

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  MCP_PUBLISHER_VERSION: "v1.8.1"
  # sha256 of mcp-publisher_linux_amd64.tar.gz from registry_1.8.1_checksums.txt
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches pyproject.toml and server.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/check_release_version.py "$TAG"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv build
      - name: twine check
        run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nasdaq-data-link-mcp-os/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp-registry:
    name: Publish server.json to the MCP Registry
    needs: [build, pypi]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the PyPI release and the Docker image
        # The registry verifies both packages, and docker-publish.yml runs in parallel.
        run: |
          pypi="https://pypi.org/pypi/nasdaq-data-link-mcp-os/${VERSION}/json"
          hub="https://hub.docker.com/v2/repositories/stefanoamorelli/nasdaq-data-link-mcp/tags/${VERSION}"
          for attempt in $(seq 1 80); do
            if curl -fsS -o /dev/null "$pypi" && curl -fsS -o /dev/null "$hub"; then
              echo "PyPI ${VERSION} and docker.io tag ${VERSION} are available"
              exit 0
            fi
            echo "waiting (${attempt}/80)..."
            sleep 30
          done
          echo "::error::PyPI ${VERSION} or the Docker image tag ${VERSION} did not appear within 40 minutes"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
